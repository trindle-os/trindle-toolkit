# What `cargo deny check` holds the dependencies to: licences that sit with
# GPL-3.0-or-later, crates.io as the only source, and no known vulnerability.

[graph]
targets = ["x86_64-unknown-linux-gnu"]

[advisories]
# A crate no longer looked after is flagged only when the toolkit names it itself;
# the deeper ones are listed by `cargo audit` for whoever updates them.
unmaintained = "workspace"
ignore = [
    # quick-xml 0.38 comes only through accesskit_unix 0.23, atspi-common and
    # zbus-lockstep, whose use of it is in atspi's own tests and is not in a built
    # program. The way out, accesskit_unix 0.24, needs Rust 1.87; see `.cargo/audit.toml`.
    { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.38 reads only atspi's own interface files, in atspi's own tests" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.38 reads only atspi's own interface files, in atspi's own tests" },
]

[licenses]
allow = [
    "GPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "ISC",
    "Unicode-3.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
