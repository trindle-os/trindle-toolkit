[package]
name = "trindle-common"
version = "0.9.0-beta.1"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "Small helpers every Trindle program shares: home and XDG folders, a private file written whole, a settings file, a notify line, a WAV header and the language-file list for build.rs. No window, Wayland or bus code."
repository = "https://github.com/trindle-os/trindle-toolkit"

[dependencies]
libc = "0.2"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
